name: QuantOptimizer CI & Automated Backtest Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest yfinance

    - name: Run Direct QuantOptimizer Test Suite
      run: |
        python mnq_backtester/run_tests.py

    - name: Run PyTest Framework Check
      run: |
        pytest mnq_backtester/tests/
